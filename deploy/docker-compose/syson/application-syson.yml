server:
  port: 8085
  servlet:
    context-path: /

spring:
  application:
    name: syson-server
  datasource:
    url: jdbc:postgresql://${SYSON_DB_HOST:syson-postgres}:${SYSON_DB_PORT:5432}/${SYSON_DB_NAME:syson_workspace_db}
    username: ${SYSON_DB_USER:syson_admin}
    password: ${SYSON_DB_PASSWORD:syson_secure_pass_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: syson_core
        dialect: org.hibernate.dialect.PostgreSQLDialect

# SysON 专有建模与视口服务配置
syson:
  kernel:
    specification-version: "2026.09"
    default-channel: "GRAPHICAL"
    session-timeout-minutes: 120
    max-file-upload-size-mb: 100
  auth:
    jwt-validation-endpoint: "http://ccdd-app:8080/api/v1/auth/validate-ticket"
