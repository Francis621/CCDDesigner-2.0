# ==============================================================================
# Open-MBEE Flexo MMS (Model Management System) Layer 1 官方应用配置
# ==============================================================================

mms {
  application {
    name = "Flexo-MMS-Layer1"
    version = "2026.09"
    port = 8088
  }

  store {
    # 存储依赖: Apache Jena Fuseki SPARQL 1.1 Quad Store
    type = "sparql"
    query-endpoint = "http://flexo-fuseki:3030/ccdd-models/query"
    update-endpoint = "http://flexo-fuseki:3030/ccdd-models/update"
    graph-store-endpoint = "http://flexo-fuseki:3030/ccdd-models/data"
    connection-timeout-ms = 10000
    read-timeout-ms = 30000
  }

  # 模型分片与多租户组织配置 (按 Org/Repo 分片)
  sharding {
    enabled = true
    default-org = "CCDD-CNC-ORG"
    default-repo = "VMC1000-SystemModel"
    strategy = "ORG_REPO_ISOLATED"
  }

  # 暂存与生产原子提升规则
  staging {
    graph-prefix = "urn:ccdd:staging:release:"
    production-graph = "urn:ccdd:production:models"
    auto-cleanup-on-failure = true
  }

  security {
    auth-enabled = false
    jwt-validation-endpoint = "http://ccdd-app:8080/api/v1/auth/validate-ticket"
  }
}
