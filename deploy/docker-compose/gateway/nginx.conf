worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # --------------------------------------------------------------------------
    # 负载均衡集群定义 (OpenSysML 无状态多实例自动轮询)
    # --------------------------------------------------------------------------
    upstream opensysml_cluster {
        # 当执行 docker compose up --scale opensysml=N 时，Docker 内嵌 DNS 自动实现轮询
        server opensysml:8086 resolve;
    }

    upstream syson_backend {
        server syson-server:8085;
    }

    upstream flexo_mms_backend {
        server flexo-mms:8088;
    }

    upstream fuseki_backend {
        server flexo-fuseki:3030;
    }

    server {
        listen 8084;
        server_name localhost;

        # ----------------------------------------------------------------------
        # MBSE 网关综合健康探针
        # ----------------------------------------------------------------------
        location /health {
            default_type application/json;
            return 200 '{"gateway":"UP","port":8084,"routes":["syson","opensysml","flexo","sparql"]}';
        }

        # ----------------------------------------------------------------------
        # 1. SysON 建模工作区与视口反代
        # ----------------------------------------------------------------------
        location /syson/ {
            proxy_pass http://syson_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------------------------
        # 2. OpenSysML 无状态语言服务 (负载均衡分发)
        # ----------------------------------------------------------------------
        location /opensysml/ {
            proxy_pass http://opensysml_cluster/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------------------------
        # 3. Flexo MMS 模型服务 Layer 1
        # ----------------------------------------------------------------------
        location /flexo/ {
            proxy_pass http://flexo_mms_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------------------------
        # 4. Apache Jena Fuseki SPARQL 1.1 端点 (读写分离/分片直通)
        # ----------------------------------------------------------------------
        location /sparql/ {
            proxy_pass http://fuseki_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
